# Offline development config: same as wrangler.toml minus the remote-only bindings
# (Workers AI, Vectorize, AI Search). Every AI feature falls back to rule-based behaviour.
# Usage: npm run dev:offline
name = "gosanchari"
main = "src/index.tsx"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
ENVIRONMENT = "development"
SITE_URL = "http://localhost:8787"
AI_GATEWAY_ID = "gosanchari"
TURNSTILE_SITE_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "gosanchari"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gosanchari-media"

# Knowledge base for AI Search (AutoRAG): property details, FAQs and policies as Markdown.
[[r2_buckets]]
binding = "KB"
bucket_name = "gosanchari-kb"



[[queues.producers]]
binding = "JOBS"
queue = "gosanchari-jobs"

[[queues.consumers]]
queue = "gosanchari-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
# 01:30 UTC = 07:00 IST daily batch; Monday 02:30 UTC = 08:00 IST weekly insights
crons = ["30 1 * * *", "30 2 * * 1"]

[observability]
enabled = true
